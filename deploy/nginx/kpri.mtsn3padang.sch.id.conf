# Nginx Virtual Host Config untuk CloudPanel - kpri.mtsn3padang.sch.id
server {
    listen 80;
    listen [::]:80;
    server_name kpri.mtsn3padang.sch.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kpri.mtsn3padang.sch.id;

    # SSL Certificate (CloudPanel / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/kpri.mtsn3padang.sch.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kpri.mtsn3padang.sch.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /home/kpri-mtsn3padang/htdocs/kpri.mtsn3padang.sch.id/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 10M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Pass PHP scripts to PHP-FPM 8.5
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
    }
}
